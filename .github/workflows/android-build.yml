name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aftercheck-build-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch pinned Stockfish source for JNI build
        env:
          STOCKFISH_TAG: sf_19
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$STOCKFISH_TAG" https://github.com/official-stockfish/Stockfish.git "$RUNNER_TEMP/stockfish"
          mkdir -p android/app/src/main/cpp/stockfish
          cp -a "$RUNNER_TEMP/stockfish/src/." android/app/src/main/cpp/stockfish/
          test -f android/app/src/main/cpp/stockfish/uci.cpp
          test -f android/app/src/main/cpp/stockfish/evaluate.h

      - name: Install Gradle 8.9
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Run unit tests and build debug APK
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aftercheck-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare checksum and release APK name
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "AfterCheck-${GITHUB_REF_NAME}-debug.apk"
          sha256sum "AfterCheck-${GITHUB_REF_NAME}-debug.apk" > "AfterCheck-${GITHUB_REF_NAME}-debug.apk.sha256"

      - name: Publish debug APK release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AfterCheck-${{ github.ref_name }}-debug.apk
            AfterCheck-${{ github.ref_name }}-debug.apk.sha256
          generate_release_notes: true
          body: |
            This is a debug APK intended for early testing, not a production-signed release.
            It contains a JNI-built Stockfish 19 shared library (GPLv3) and downloads the official
            matching NNUE network at first analysis. Corresponding source and licensing information
            are documented in third_party/stockfish/README.md. Configure secure release signing
            before distributing a production app.
